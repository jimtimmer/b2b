<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evangelische Gemeente Ecclesia</title>
  <link rel="icon" href="img/favicon.png" type="image/png">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css" />
</head>
<body>

  <!-- SIDEBAR -->
  <aside id="sidebar"></aside>

  <!-- HOOFDINHOUD -->
  <main id="inhoud">

    <div class="pagina-inhoud">

      <!-- Banner hero -->
      <section class="banner-hero fade-in fade-in-1">
        <div class="banner-overlay">
          <!-- <h2>Evangelische Gemeente Ecclesia</h2> -->
        </div>
      </section>

      <div class="pagina-inhoud-smal">

        <!-- Eerstvolgende dienst -->
        <div class="fade-in fade-in-2" style="margin-bottom: 1.5rem;">
          <div class="kaart dienst-uitgelicht">
            <div class="kaart-header">
              <h3><i class="ph ph-push-pin"></i> Eerstvolgende dienst</h3>
              <span class="kaart-label">Deze week</span>
            </div>
            <div class="kaart-body" id="eerstvolgende-dienst">
              <p class="laad-tekst">Laden...</p>
            </div>
          </div>
        </div>

        <!-- Dashboard grid -->
        <div class="dashboard-grid">

          <!-- Agenda -->
          <div class="kaart fade-in fade-in-3">
            <div class="kaart-header">
              <h3><i class="ph ph-calendar"></i> Komende diensten</h3>
              <a href="/agenda" class="kaart-label" style="text-decoration:none;color:var(--kleur-accent)">Alles →</a>
            </div>
            <div class="kaart-body" id="agenda-lijst">
              <p class="laad-tekst">Laden...</p>
            </div>
          </div>

          <!-- Nieuws -->
          <div class="kaart fade-in fade-in-4">
            <div class="kaart-header">
              <h3><i class="ph ph-newspaper"></i> Laatste nieuws</h3>
              <a href="/nieuws" class="kaart-label" style="text-decoration:none;color:var(--kleur-accent)">Alles →</a>
            </div>
            <div class="kaart-body" id="nieuws-lijst">
              <p class="laad-tekst">Laden...</p>
            </div>
          </div>

        </div>

      </div>
    </div>
  </main>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

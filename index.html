<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Evangelische Gemeente Ecclesia</title>
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>

  <!-- Banner met topmenu (menu wordt door main.js ingevoegd) -->
  <section class="hero">
    <div class="hero-midden">
      <div>
        <h1>Welkom bij EG-Ecclesia</h1>
        <p>&ldquo;Ecclesia betekent gemeenschap van gelovigen en dat zijn wij, met allen die in Hem geloven.&rdquo;</p>
      </div>
    </div>
  </section>

  <main id="inhoud">
    <div class="inhoud">

      <!-- Eerstvolgende samenkomst -->
      <div class="blok samenkomst-blok fade-in fade-in-1" id="samenkomst">
        <p class="laad-tekst">Laden...</p>
      </div>

      <div class="onder-grid">
        <!-- Komende diensten -->
        <div class="blok fade-in fade-in-2" id="agenda-lijst">
          <p class="laad-tekst">Laden...</p>
        </div>

        <!-- Laatste nieuws -->
        <div class="blok fade-in fade-in-3" id="nieuws-lijst">
          <p class="laad-tekst">Laden...</p>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/main.js"></script>

</html>

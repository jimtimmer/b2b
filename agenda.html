<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agenda — Back2Basics</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <aside id="sidebar"></aside>

  <main id="inhoud">

    <header class="pagina-header">
      <h1 id="pagina-titel">Agenda</h1>
      <span class="header-datum" id="header-datum"></span>
    </header>

    <div class="pagina-inhoud">

      <section class="hero fade-in fade-in-1">
        <div class="hero-inhoud">
          <span class="hero-label">Kom samen</span>
          <h2>Elke zondag om <em>10:00 uur</em></h2>
          <p>We komen samen in de Hoofdzaal. Iedereen is welkom — of je nu voor het eerst bent of al jaren meeloopt.</p>
        </div>
      </section>

      <div class="agenda-volledig fade-in fade-in-2" id="agenda-container">
        <p class="laad-tekst">Agenda laden...</p>
      </div>

    </div>
  </main>

  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
  <script src="js/main.js"></script>
</body>
</html>

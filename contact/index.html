<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact — Evangelische Gemeente Ecclesia</title>
  <link rel="icon" href="/img/favicon.png" type="image/png">
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.0.3/src/regular/style.css" />
</head>
<body>

  <aside id="sidebar"></aside>

  <main id="inhoud">

    <div class="pagina-inhoud">

      <!-- Contact banner -->
      <section class="contact-banner fade-in fade-in-1">
        <div class="contact-banner-overlay">
          <h2>Kom in contact</h2>
        </div>
      </section>

      <div class="pagina-inhoud-smal">

        <!-- Contact grid -->
        <div class="contact-grid fade-in fade-in-2">

          <!-- Mail ons -->
          <div class="contact-formulier mail-ons mail-ons--breed">
            <h3>Stuur ons een mail</h3>
            <p>Heeft u een vraag of wilt u gewoon even hallo zeggen? Stuur ons een e-mail — wij zorgen voor een snelle reactie.</p>
            <a href="mailto:info@eg-ecclesia.nl" class="mail-knop">
              <i class="ph ph-envelope"></i>
              info@eg-ecclesia.nl
            </a>
          </div>

        </div>

      </div>
    </div>
  </main>

  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script src="/js/main.js"></script>
</body>
</html>
